  /user/{id}:
    get:
      tags:
        - user
      summary: Get user by ID
      description: Получение целого пользователя по ID
      operationId: GetUserById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: User found
