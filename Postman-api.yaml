openapi: '3.0.3'
info:
  title: Kukuda API
  version: '1.0'
tags:
  - name: auth
    description: Authorization
  - name: user
    description: User CRUD
  - name: subscription
    description: Subscription CRUD
  - name: event
    description: Event CRUD
  - name: review
    description: Review CRUD
  - name: category
    description: Category CRUD
  - name: eventDetails
    description: More info about event

paths:
  /auth/login:
    post:
      tags:
        - auth
      summary: Login user
      description: Вход в аккаунт
      operationId: LoginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginUser"
      responses:
        "200":
          description: Successfully logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: Bad User Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBadRequest'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'

  /auth/register:
    post:
      tags:
        - auth
      summary: Register a new user
      description: Регистрация пользователя
      operationId: CreateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUser"
      responses:
        "200":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Bad User Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBadRequest'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
  
  /auth/refresh:
    post:
      tags:
        - auth
      summary: Refresh tokens
      description: Обновление токенов
      operationId: RefreshTokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshToken'
      responses:
        "200":
          description: New access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        "400":
          description: Bad Token Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBadRequest'
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorUnauthorized'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'


  /user/filter:
    post:
      tags:
        - user
      summary: Filter users with criteria
      description: Получение списка пользователей с фильтрами
      operationId: FilterUsers
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FilterUsersRequest"
      responses:
        "200":
          description: Filtered list of users
          content:
            application/json:
              schema:
