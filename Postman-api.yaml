components:
  schemas:
    LoginUser:
      type: object
      properties:
        login:
          type: string
        password:
          type: string
          format: password
      required:
        - login
        - password

    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT access token
        refreshToken:
          type: string
          description: JWT refresh token
      required:
        - accessToken
        - refreshToken

    RefreshToken:
      type: object
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken


    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
      required:
        - id
        - name
        - description

    CreateCategory:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
      required:
        - name
        - description


    ErrorBadRequest:
      description: Bad Request
      type: object
      properties:
        error:
          type: string
          example: Invalid request
      required:
        - error

    ErrorUnauthorized:
      description: Unauthorized
      type: object
      properties:
        error:
          type: string
          example: Unauthorized
      required:
        - error


    ErrorForbidden:
      description: Forbidden
      type: object
      properties:
        error:
          type: string
          example: Forbidden
      required:
        - error


    ErrorNotFound:
      description: Not Found
      type: object
      properties:
        error:
          type: string
          example: Not Found
      required:
        - error


    InternalServerError:
      description: Internal Server Error
      type: object
      properties:
        error:
          type: string
          example: Internal Server Error
      required:
        - error



    Event:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        ageRestriction:
          $ref: '#/components/schemas/EventAgeRestriction'
        startDate:
          type: string
          format: date-time
          description: datetime в формате RFC3339
        endDate:
          type: string
          format: date-time
          description: datetime в формате RFC3339
        creatorId:
          type: string
          format: uuid
        capacity:
          type: integer
        status:
          $ref: '#/components/schemas/EventStatus'
        createdAt:
          type: string
          format: date-time
          description: datetime в формате RFC3339
        updatedAt:
          type: string
          format: date-time
          description: datetime в формате RFC3339
        categories:
          type: array
          description: Массив категорий, к которым относится мероприятие
          items:
            $ref: '#/components/schemas/Category'
      required:
        - id
        - title
        - description
        - ageRestriction
        - startDate
        - endDate
        - creatorId
        - status
        - createdAt
        - updatedAt

    EventAgeRestriction:
      type: integer
      enum:
        - 0
        - 6
        - 12
        - 16
        - 18
      default: 0

    EventStatus:
      type: string
      enum:
        - pending
        - approved
        - finished
        - canceled
      default: pending

    CreateEvent:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        ageRestriction:
          $ref: '#/components/schemas/EventAgeRestriction'
        startDate:
          type: string
          format: date-time
          description: datetime в формате RFC3339
        endDate:
          type: string
          format: date-time
          description: datetime в формате RFC3339
        capacity:
          type: integer
        categories:
          type: array
          description: Массив ID категорий, к которым относится мероприятие
          items:
            type: string
            format: uuid
      required:
        - title
        - description
        - startDate
        - endDate

    UpdateEvent:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        ageRestriction:
          $ref: '#/components/schemas/EventAgeRestriction'
        startDate:
          type: string
          format: date-time
          description: datetime в формате RFC3339
        endDate:
          type: string
          format: date-time
          description: datetime в формате RFC3339
        capacity:
          type: integer
        status:
          $ref: '#/components/schemas/EventStatus'
        categories:
          type: array
          description: Массив ID категорий, к которым относится мероприятие
          items:
            type: string
            format: uuid

    Review:
      type: object
      properties:
        id:
          type: string
          format: uuid
        rating:
          type: integer
          description: от 2 до 10 (оценки от 1 до 5 но в удвоенном формате)
        comment:
          type: string
        userId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
          description: datetime в формате RFC3339
        updatedAt:
          type: string
          format: date-time
          description: datetime в формате RFC3339
      required:
        - id
        - rating
        - comment
        - userId
        - createdAt
        - updatedAt

    CreateReview:
      type: object
      properties:
        rating:
          type: integer
        comment:
          type: string
        userId:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
      required:
        - rating
        - comment
        - userId
        - eventId

    UpdateReview:
      type: object
      properties:
        id:
          type: string
          format: uuid
        rating:
          type: integer
        comment:
          type: string
      required:
        - id
        - rating
        - comment


    Subscription:
      type: object
      properties:
        subscriberId:
          type: string
          format: uuid
        subscribedToId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
          description: datetime в формате RFC3339
      required:
        - subscriberId
        - subscribedToId

    CreateSubscription:
      type: object
      properties:
        subscriberId:
          type: string
          format: uuid
        subscribedToId:
          type: string
          format: uuid
      required:
        - subscriberId
        - subscribedToId


    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        login:
          type: string
        passwordHashed:
          type: string
        phone:
          type: string
        lastName:
          type: string
        name:
          type: string
        gender:
          $ref: '#/components/schemas/UserGender'
        birthDate:
          type: string
          format: date-time
          description: datetime в формате RFC3339
        role:
          $ref: '#/components/schemas/UserRole'
        createdAt:
          type: string
          format: date-time
          description: datetime в формате RFC3339
        updatedAt:
          type: string
          format: date-time
          description: datetime в формате RFC3339
        isDeleted:
          type: boolean
          default: false
        isActive:
          type: boolean
      required:
        - id
        - login
        - email
        - passwordHashed
        - phone
        - name
        - role
        - createdAt
        - updatedAt
        - isActive

    CreateUser:
      type: object
      properties:
        login:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        phone:
          type: string
        lastName:
          type: string
        birthDate:
          type: string
          format: date-time
          description: datetime в формате RFC3339
        name:
          type: string
        gender:
          $ref: '#/components/schemas/UserGender'
        role:
          $ref: '#/components/schemas/UserRole'
      required:
        - login
        - email
        - password
        - phone
        - name
        - gender
        - role

    UpdateUser:
      type: object
      properties:
        login:
          type: string
        phone:
          type: string
        lastName:
          type: string
        name:
          type: string
        birthDate:
          type: string
          format: date-time
          description: datetime в формате RFC3339
        gender:
          $ref: '#/components/schemas/UserGender'
        isActive:
          type: boolean

    UpdateUserEmail:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
        - email

    UpdateUserPassword:
      type: object
      properties:
        oldPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
      required:
        - oldPassword
        - newPassword


    UserInfo:
      type: object
      properties:
        login:
          type: string
        phone:
          type: string
        lastName:
          type: string
        name:
          type: string
        birthDate:
          type: string
          format: date-time
          description: datetime в формате RFC3339
        gender:
          $ref: '#/components/schemas/UserGender'
        role:
          $ref: '#/components/schemas/UserRole'
        isActive:
          type: boolean

    FilterUsersRequest:
      type: object
      properties:
        isActive:
          type: boolean
        role:
          $ref: '#/components/schemas/UserRole'
        gender:
          $ref: '#/components/schemas/UserGender'
        isDeleted:
          type: boolean
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
        offset:
          type: integer
          minimum: 0
          default: 0

    UserRole:
      type: string
      default:
        user
      enum:
        - moderator
        - user
        - admin

    UserGender:
      type: string
      enum:
        - male
        - female

    URLForUserProfilePicture:
      type: object
      properties:
        url:
          type: string
          format: url
      required:
        - url

    URLsForImages:
      type: object
      properties:
        urls:
          type: array
          items:
            type: string
            format: url
          description: Ссылки на скачивание картинок


    UploadImages:
      type: object
      properties:
        imagesCount:
          type: integer
          description: Сколько ссылок нужно для загрузки, имена дает сам бэк

    Location:
      type: object
      properties:
        id:
          type: string
          format: uuid
        point:
          $ref: '#/components/schemas/GeoPoint'
        address:
          type: string
          description: Адрес
      required:
        - id
        - point
        - address

    UserLocation:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        point:
          $ref: '#/components/schemas/GeoPoint'
        timestamp:
          type: string
          format: date-time
      required:
        - userId
        - point
        - timestamp

    RouteBase:
      type: object
      properties:
        userId:
          type: string 
          format: uuid
        originPoint:
          $ref: '#/components/schemas/GeoPoint'
        destinationPoint:
          $ref: '#/components/schemas/GeoPoint'

    RouteRequest:
      allOf:
        - $ref: '#/components/schemas/RouteBase'

    Route:
      allOf:
        - $ref: '#/components/schemas/RouteBase'
        - type: object
          properties:
            id:
              type: string
              format: uuid
            path:
              type: array
              items:
                $ref: '#/components/schemas/GeoPoint'
            distanceM:
              type: integer
              description: Длина маршрута в метрах
            durationSec:
              type: integer
              description: Длительность маршрута в секундах
            createdAt:
              type: string
              format: date-time
          required:
            - id
            - userId
            - originPoint
            - destinationPoint
            - path
            - distanceM
            - durationSec
            - createdAt

    GeoPoint:
      type: object
      properties:
        lat:
          type: number
          format: double
          description: Широта
        lng:
          type: number
          format: double
          description: Долгота
      required:
        - lat
        - lng
