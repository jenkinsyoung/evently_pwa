                items:
                  $ref: "#/components/schemas/UserInfo"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBadRequest'
        "401":
          description: Unauthorized Request
          content:
            application/json:
              schema:
